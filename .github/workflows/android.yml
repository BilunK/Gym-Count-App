name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Icono de la app
        run: |
          if [ -d icono/res ]; then cp -r icono/res/. android/app/src/main/res/; fi
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Gym-Count-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Gym-Count.apk
          gh release delete ultima --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create ultima Gym-Count.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Gym Count (última versión)" --notes "APK de la última compilación."
