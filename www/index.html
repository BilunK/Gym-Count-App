const num=s=>{const v=parseFloat(String(s).replace(',','.'));return isNaN(v)?null:v};




function routine(){
  $('chips').innerHTML=SH.map((s,i)=>`<button class='${i===rd?'on':''}' data-d='${i}'>${s}</button>`).join('');
  const list=S.routine[rd]=S.routine[rd]||[];
  const mo=e=>S.mus.map(m=>`<option value='${m.id}'${m.id===e.muscle?' selected':''}>${esc(mn(m))}</option>`).join('')+(S.mus.some(m=>m.id===e.muscle)?'':`<option value='' selected>${D.nc}</option>`);
  const uo=e=>S.units.map(u=>`<option value='${u.id}'${u.id===e.unit?' selected':''}>${esc(u.n||D.un[u.d])}</option>`).join('');
  $('rl').innerHTML=`<div class='lbl' style='margin:0 4px 10px'>${DAYS[rd]}</div>`+(list.length?list.map(e=>`<div class='ex' data-id='${e.id}'><div class='row1'><input class='nm' data-f='name' value='${esc(e.name)}' placeholder='${esc(mname(e.muscle))}'><button class='del' data-del='${e.id}'>×</button></div><div class='fs'><label style='grid-column:span 2'>${D.mu}<select class='f' data-f='muscle'>${mo(e)}</select></label><label>${D.nx}<input class='f' type='number' inputmode='numeric' min='1' max='10' data-f='count' value='${e.count||1}'></label><label>${D.se}<input class='f' type='number' inputmode='numeric' min='1' max='20' data-f='sets' value='${e.sets}'></label><label>${D.am}<input class='f' type='number' inputmode='numeric' min='1' max='999' data-f='reps' value='${e.reps}'></label><label>${D.ut}<select class='f' data-f='unit'>${uo(e)}</select></label></div></div>`).join(''):`<p class='empty'>${D.ne}</p>`);
}
$('rl').oninput=ev=>{const t=ev.target,row=t.closest('.ex');if(!row)return;
  const e=S.routine[rd].find(x=>x.id===row.dataset.id);if(!e)return;const f=t.dataset.f;
  e[f]=t.type==='number'?Math.max(1,Math.min(+t.max||99,+t.value||1)):t.value;
  if(f==='muscle')row.querySelector('.nm').placeholder=mname(e.muscle);save()};
$('add').onclick=()=>{S.routine[rd].push({id:uid(),name:'',muscle:S.mus[0]?S.mus[0].id:'',sets:4,reps:10,unit:S.units[0].id,count:1});save();routine();const n=document.querySelectorAll('.ex .nm');n[n.length-1].focus()};



document.body.insertAdjacentHTML('beforeend',"<div class='ov' id='ov2' hidden><div class='sheet' id='bx' role='dialog' aria-modal='true'></div></div>");

$('moods').insertAdjacentHTML('afterend',"<textarea id='nt' rows='3' maxlength='300'></textarea><button class='primary' id='sv' disabled></button>");
$('nt').placeholder=D.nt;$('sv').textContent=D.sv;
let pm=0;
const mkSel=()=>{document.querySelectorAll('#moods button').forEach(b=>b.classList.toggle('on',+b.dataset.m===pm));$('sv').disabled=!pm};
function openMood(){const c=S.days[key(cur)];pm=c?c.mood:0;$('nt').value=(c&&c.note)||'';$('sd').textContent=fmt(cur)+', '+DAYS[wd(cur)];mkSel();$('unc').hidden=!c;$('ov').hidden=false}

$('settings').insertAdjacentHTML('beforeend',`<details class='group adv' style='margin-top:14px'><summary>${D.av}</summary><div class='lbl'>${D.mg2}</div><div id='me'></div><button class='alt' id='ma'>${D.ma}</button><div class='lbl' style='margin-top:18px'>${D.un2}</div><div id='ue'></div><button class='alt' id='ua'>${D.ua}</button><div class='lbl' style='margin-top:18px'>${D.dt}</div><button class='alt' id='xp' style='margin-top:0'>${D.xp}</button><button class='alt' id='ip'>${D.ip}</button><input type='file' id='fi' accept='text/plain,.txt' hidden><button class='alt red' id='rs' style='margin-top:18px'>${D.rst}</button></details>`);
const rme=()=>{$('me').innerHTML=S.mus.map((m,i)=>`<div class='er' data-i='${i}'><button data-m='u'${i?'':' disabled'}>↑</button><button data-m='d'${i<S.mus.length-1?'':' disabled'}>↓</button><input value='${esc(mn(m))}'><button data-m='x'>×</button></div>`).join('')};

$('ma').onclick=()=>{S.mus.push({id:'c'+uid(),n:D.mu});save();rme()};
const rue=()=>{$('ue').innerHTML=S.units.map((u,i)=>`<div class='er' data-i='${i}'><input value='${esc(u.n||D.un[u.d])}'><button data-m='x'${S.units.length>1?'':' disabled'}>×</button></div>`).join('')};
$('ue').onclick=ev=>{const b=ev.target.closest('[data-m]');if(!b||b.disabled)return;S.units.splice(+b.closest('.er').dataset.i,1);save();rue()};
$('ue').oninput=ev=>{S.units[+ev.target.closest('.er').dataset.i].n=ev.target.value;save()};
$('ua').onclick=()=>{S.units.push({id:'c'+uid(),n:D.ut});save();rue()};

$('xp').onclick=async()=>{flush();
  const txt=JSON.stringify(Object.assign({app:'gymcount'},pack(),{log:packLog()})),fn='gym-count-backup.txt',P=(window.Capacitor&&Capacitor.Plugins)||{};
  try{if(P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:fn,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:fn,url:r.uri});return}}
  catch(e){if(/cancel/i.test((e&&e.message)||''))return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()};
$('ip').onclick=()=>$('fi').click();



$('settings').insertAdjacentHTML('beforebegin',`<section id='marks' hidden><h2>${D.mk}</h2><div class='chs' id='mf'></div><div class='mbar' id='mb' hidden></div><div class='mgrid' id='mg'></div><button class='fab' id='fab' aria-label='+'>+</button></section>`);
$('nav').querySelector('[data-v=hist]').insertAdjacentHTML('afterend',`<button data-v='marks'>${D.mk}</button>`);
let fold=null;const sel=new Set();
const mf=m=>S.mus.some(x=>x.id===m.muscle)?m.muscle:'';
const folders=()=>S.mus.map(m=>({id:m.id,n:mn(m)})).concat(S.marks.some(m=>!mf(m))?[{id:'',n:D.nc}]:[]);
const fv=m=>m.hist.length?m.hist[m.hist.length-1].v:null;
const fmtv=(v,t)=>v==null?'—':String(+v.toFixed(2)).replace('.',',')+' '+(t==='t'?'min':'kg');

const tog=id=>{sel.has(id)?sel.delete(id):sel.add(id);rMarks()};
let lt=0,lpd=0;
$('mg').onpointerdown=e=>{const c=e.target.closest('.mc');if(!c||e.target.closest('select'))return;lpd=0;lt=setTimeout(()=>{lpd=1;tog(c.dataset.id)},450)};
['pointerup','pointerleave','pointercancel'].forEach(t=>{$('mg')['on'+t]=()=>clearTimeout(lt)});
$('mg').oncontextmenu=e=>e.preventDefault();
$('mg').onclick=e=>{if(lpd){lpd=0;return}const c=e.target.closest('.mc');if(!c||e.target.closest('select'))return;sel.size?tog(c.dataset.id):detail(c.dataset.id)};

$('mf').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fold=b.dataset.f;sel.clear();rMarks()}};
$('mb').onclick=e=>{if(e.target.closest('#sc')){sel.clear();rMarks()}if(e.target.closest('#tr'))ask(D.dq.replace('{n}',sel.size),D.dx,D.bd,()=>{S.marks=S.marks.filter(m=>!sel.has(m.id));sel.clear();save();rMarks()},1)};
$('fab').onclick=()=>{
  dlg(`<h3>${D.nw}</h3><label class='fl'>${D.nm}<input id='an' class='f'></label><label class='fl'>${D.ty}<select id='at' class='f'><option value='w'>${D.wt} (kg)</option><option value='t'>${D.tm} (min)</option></select></label><label class='fl'>${D.vl}<input id='ax' class='f' inputmode='decimal'></label><label class='fl'>${D.fl}<select id='af' class='f'>${folders().map(f=>`<option value='${f.id}'${f.id===fold?' selected':''}>${esc(f.n)}</option>`).join('')}</select></label><button class='primary' id='as'>${D.sv}</button><button class='alt' id='no'>${D.ca}</button>`);
  $('no').onclick=cls;
  $('as').onclick=()=>{const n=$('an').value.trim();if(!n){$('an').focus();return}const v=num($('ax').value);S.marks.push({id:uid(),name:n,type:$('at').value,muscle:$('af').value,hist:v==null?[]:[{v,d:key(new Date())}]});save();cls();rMarks()}};
function detail(id){
  const m=S.marks.find(x=>x.id===id);if(!m)return;
  dlg(`<h3 class='ell'>${esc(m.name)}</h3><div class='mv'>${fmtv(fv(m),m.type)}</div><div class='row1' style='margin:12px 0'><input id='nv' class='f' inputmode='decimal' placeholder='${D.up} (${m.type==='t'?'min':'kg'})'><button class='primary' id='nu' style='width:auto;padding:0 18px;height:42px;margin:0'>${D.sv}</button></div><div class='lbl'>${D.hp}</div><div class='hl2'>${m.hist.map((h,i)=>`<div class='hr'><span>${fmt(new Date(h.d+'T12:00:00'))}</span><b>${fmtv(h.v,m.type)}</b><button data-x='${i}'>×</button></div>`).reverse().join('')||'—'}</div><button class='alt' id='no'>${D.cl2}</button>`);
  $('no').onclick=cls;
  $('nu').onclick=()=>{const v=num($('nv').value);if(v==null)return;m.hist.push({v,d:key(new Date())});save();rMarks();detail(id)};
  $('bx').querySelector('.hl2').onclick=ev=>{const b=ev.target.closest('[data-x]');if(!b)return;m.hist.splice(+b.dataset.x,1);save();rMarks();detail(id)}}

function show(v){
  ['today','routine','hist','progress','marks','settings'].forEach(s=>{$(s).hidden=s!==v});$('nav').classList.remove('open');
  ({today,routine,hist,progress:prog,marks:rMarks,settings:()=>{rme();rue()}})[v]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo(0,0)}

const bname=e=>(e.name||'').trim()||mname(e.muscle);


const dts=(k,d,n)=>Array.from({length:n},(_,j)=>`<span class='dot${j<d?' on':''}${pulse&&pulse.id===k&&pulse.i===j?' pop':''}'>${j+1}</span>`).join('');

let lastF=null;
function rMarks(){
  const F=folders();if(!F.some(f=>f.id===fold))fold=F.length?F[0].id:null;
  $('mf').innerHTML=F.map(f=>`<button class='ch${f.id===fold?' on':''}' data-f='${f.id}'>${esc(f.n)}</button>`).join('');
  const on=$('mf').querySelector('.on');
  if(on&&lastF!==fold){const c=$('mf'),r=on.getBoundingClientRect(),q=c.getBoundingClientRect();c.scrollLeft+=r.left-q.left-(q.width-r.width)/2}
  lastF=fold;
  $('mb').hidden=!sel.size;
  $('mb').innerHTML=`<span class='cn'>${sel.size}</span><select id='mvs'><option value='' selected disabled>${D.mv}</option>${S.mus.map(x=>`<option value='${x.id}'>${esc(mn(x))}</option>`).join('')}</select><button id='tr' aria-label='${D.bd}'><svg viewBox='0 0 24 24'><path d='M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5'/></svg></button><button id='sc'>✕</button>`;
  const L=S.marks.filter(m=>mf(m)===fold);
  $('mg').innerHTML=L.length?L.map(m=>{const h=m.hist,v=fv(m),p=h.length>1?h[h.length-2].v:null;
    return `<div class='mc${sel.has(m.id)?' sel':''}' data-id='${m.id}'><b>${esc(m.name)}</b><small>${m.type==='t'?D.tm:D.wt}</small><div class='mv'>${fmtv(v,m.type)}</div><div class='pv'>${p!=null?(v>p?'↑':v<p?'↓':'=')+' '+D.bf+' '+fmtv(p,m.type):''}</div></div>`}).join(''):`<p class='empty' style='grid-column:1/-1'>${D.em}</p>`;
}
$('mb').onchange=e=>{const v=e.target.value;if(!sel.size||!v)return;S.marks.forEach(m=>{if(sel.has(m.id))m.muscle=v});sel.clear();save();rMarks()};
$('mf').onwheel=e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){$('mf').scrollLeft+=e.deltaY;e.preventDefault()}};
const BY={es:'Hecho por',en:'Made by',fr:'Fait par',de:'Gemacht von',pt:'Feito por',it:'Realizzato da'}[K];
$('settings').insertAdjacentHTML('beforeend',`<p class='credit'>${BY}<br><b>Miguel Palarea García</b></p>`);

const snap=()=>(S.routine[wd(cur)]||[]).map(e=>{const g=S.log[key(cur)]||{};return{n:bname(e),m:mname(e.muscle),u:uname(e.unit),s:e.sets,r:e.reps,d:insts([e]).map(x=>Math.min((g[x.k]||{}).done||0,e.sets))}});
const btn=(k,d,n,h,ro)=>`<div class='pm${h?' h':''}'><button data-a='p' data-id='${k}'${ro||d>=n?' disabled':''}>+</button><button data-a='m' data-id='${k}'${ro||d<=0?' disabled':''}>−</button></div>`;
function today(){
  const k=key(cur),c=S.days[k],lg=S.log[k]||{},R=S.routine[wd(cur)]||[];
  const C=c?c.ex.map(o=>({t:o.n,g:o.m,a:o.r+' '+o.u,n:o.s,d:o.d,k:o.d.map(()=>'')})):R.map(e=>{const I=insts([e]);return{t:bname(e),g:mname(e.muscle),a:e.reps+' '+uname(e.unit),n:e.sets,k:I.map(x=>x.k),d:I.map(x=>Math.min((lg[x.k]||{}).done||0,e.sets))}});
  $('date').textContent=fmt(cur);$('wd').textContent=DAYS[wd(cur)];$('cnt').textContent=C.reduce((a,o)=>a+o.d.length,0)+' '+D.ex;
  $('list').innerHTML=C.length?C.map(o=>{const one=o.d.length<2,ro=!!c;
    const body=o.d.map((d,i)=>one?`<div class='dots'>${dts(o.k[i],d,o.n)}</div>`:`<div class='rw'><span class='rn'>${i+1}</span><div class='dots'>${dts(o.k[i],d,o.n)}</div>${btn(o.k[i],d,o.n,1,ro)}</div>`).join('');
    return `<article class='card${o.d.every(d=>d>=o.n)?' full':''}'><div class='top'><div><h3>${esc(o.t)}</h3><div class='meta'><span class='tag'>${esc(o.g)}</span><span class='am'>${esc(o.a)}</span></div></div>${one?btn(o.k[0],o.d[0],o.n,0,ro):''}</div>${body}</article>`}).join(''):`<p class='empty'>${D.fd}</p>`;
  const b=$('comp');b.hidden=!(c||C.length);b.className='primary'+(c?' ok':'');b.textContent=c?MO[c.mood-1].e+' '+D.cm+' '+D.mo[c.mood-1]:D.cd;
}
$('list').onclick=ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;
  const x=insts(S.routine[wd(cur)]||[]).find(x=>x.k===b.dataset.id);if(!x)return;
  const lg=S.log[key(cur)]=S.log[key(cur)]||{},l=lg[x.k]=lg[x.k]||{done:0};l.done=Math.min(l.done||0,x.e.sets);
  if(b.dataset.a==='p'&&l.done<x.e.sets){l.done++;pulse={id:x.k,i:l.done-1}}
  if(b.dataset.a==='m')l.done=Math.max(0,l.done-1);
  saveLog();today();pulse=null};
function hist(){const ks=Object.keys(S.days).sort().reverse();
  $('hl').innerHTML=ks.length?ks.map(k=>{const d=S.days[k],m=MO[d.mood-1],dt=new Date(k+'T12:00:00');let a=0,t=0;d.ex.forEach(o=>o.d.forEach(x=>{a+=Math.min(x,o.s);t+=o.s}));
    return `<button class='card hrow' data-k='${k}'><div class='hd'><b>${fmt(dt)}</b><small>${DAYS[wd(dt)]}</small></div><div class='hm'><span class='mj' style='background:${m.c}33'>${m.e}</span>${D.mo[d.mood-1]}</div><div class='hx'>${a}/${t} ${D.sr}${d.ex.length?': '+esc(d.ex.map(o=>o.n).join(', ')):''}</div>${d.note?`<div class='hx nt'>${esc(d.note)}</div>`:''}</button>`}).join(''):EMP}
$('sv').onclick=()=>{const k=key(cur),o=S.days[k]||{ex:snap()};o.mood=pm;o.note=$('nt').value.trim();S.days[k]=o;delete S.log[k];save();saveLog();$('ov').hidden=true;today()};
$('unc').onclick=()=>{const k=key(cur),c=S.days[k];if(c){const g=S.log[k]={},pool=c.ex.slice();(S.routine[wd(cur)]||[]).forEach(e=>{const t=[bname(e),mname(e.muscle),uname(e.unit),e.sets,e.reps].join('|'),j=pool.findIndex(o=>[o.n,o.m,o.u,o.s,o.r].join('|')===t);if(j<0)return;const o=pool.splice(j,1)[0];insts([e]).forEach((x,i)=>{if(o.d[i])g[x.k]={done:o.d[i]}})})}delete S.days[k];save();saveLog();$('ov').hidden=true;today()};
$('fi').onchange=()=>{const f=$('fi').files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result);if(d.app!=='gymcount'||!(d.days||(d.data&&d.data.routine)))throw 0}catch(e){alert(D.ie);return}
    ask(D.iq,D.ix,D.ik,()=>{_off=1;['gc:data','gc:log','gymcount:v1'].forEach(k=>localStorage.removeItem(k));
      if(d.v===2){const o=d.data;delete o.theme;delete o.ac;delete o.fs;localStorage.setItem('gymcount:v1',JSON.stringify(o))}
      else{const l=d.log||{};delete d.app;delete d.log;localStorage.setItem('gc:data',JSON.stringify(d));localStorage.setItem('gc:log',JSON.stringify(l))}
      location.reload()},1)};
  r.readAsText(f);$('fi').value=''};
$('rs').onclick=()=>ask(D.rq,D.rx,D.bd,()=>ask(D.rs2,D.rx2,D.bd,()=>{_off=1;['gc:data','gc:log','gc:ui','gymcount:v1'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()},1),1);
function convOld(){const o=S._old;if(!o)return;delete S._old;
  Object.keys(o.days||{}).forEach(k=>{const d=o.days[k],w=wd(new Date(k+'T12:00:00')),g=(o.log||{})[k]||{};
    S.days[k]={mood:d.mood,note:d.note||'',ex:(S.routine[w]||[]).map(e=>({n:bname(e),m:mname(e.muscle),u:uname(e.unit),s:e.sets,r:e.reps,d:insts([e]).map(x=>Math.min((g[x.k]||{}).done||0,e.sets))}))}});
  Object.keys(o.log||{}).forEach(k=>{if(!S.days[k])S.log[k]=o.log[k]});save()}
let sx=0,sy=0,sOk=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;sOk=e.touches.length===1&&sx>24&&sx<innerWidth-24&&!e.target.closest('input,select,textarea')},{passive:true});
document.addEventListener('touchend',e=>{if(!sOk)return;sOk=0;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5||!$('ov').hidden||!$('ov2').hidden)return;const n=dx<0?1:-1;
  if(!$('today').hidden){cur.setDate(cur.getDate()+n);today()}else if(!$('routine').hidden){rd=(rd+n+7)%7;routine()}},{passive:true});
convOld();
lang();theme();show('today');
</script>
