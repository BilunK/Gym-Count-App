const IK=['chest','back','legs','shoulders','biceps','triceps','core','glutes','cardio','forearms','calves'];
const mimg=m=>m.img||(m.d!=null?IK[m.d]:'')||'dumbbell';
const mi=k=>{const[v,x]=IMG[k]||IMG.dumbbell;return `<svg viewBox='${v}' fill='currentColor'>${x}</svg>`};
const imgId=id=>{const m=S.mus.find(x=>x.id===id);return m?mimg(m):''};
const imgN=n=>{const m=S.mus.find(x=>mn(x)===n);return m?mimg(m):''};
const ctr=b=>{const o=b.querySelector('.on');if(o){const r=o.getBoundingClientRect(),q=b.getBoundingClientRect();b.scrollLeft+=r.left-q.left-(q.width-r.width)/2}};

function sortable(box,arr,after){
  box.onpointerdown=e=>{const h=e.target.closest('.hd2');if(!h)return;const row=h.closest('.er');if(h.setPointerCapture)try{h.setPointerCapture(e.pointerId)}catch(x){}row.classList.add('drag');
    const mv=ev=>{const t=document.elementFromPoint(ev.clientX,ev.clientY),o=t&&t.closest('.er');if(o&&o!==row&&box.contains(o)){const ch=[...box.children];box.insertBefore(row,ch.indexOf(row)<ch.indexOf(o)?o.nextSibling:o)}};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);row.classList.remove('drag');const n=[...box.children].map(c=>arr[+c.dataset.i]);arr.splice(0,arr.length,...n);save();after()};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}}
const rme=()=>{$('me').innerHTML=S.mus.map((m,i)=>`<div class='er' data-i='${i}'><span class='hd2'></span><button class='th' data-m='i'>${mi(mimg(m))}</button><input value='${esc(mn(m))}'><button class='x' data-m='x'>×</button></div>`).join('')};
const rue=()=>{$('ue').innerHTML=S.units.map((u,i)=>`<div class='er' data-i='${i}'><span class='hd2'></span><input value='${esc(u.n||D.un[u.d])}'><button class='x' data-m='x'${S.units.length>1?'':' disabled'}>×</button></div>`).join('')};
function pick(m){dlg(`<h3>${D.pk}</h3><div class='pg'>${Object.keys(IMG).map(k=>`<button class='th${k===mimg(m)?' on':''}' data-k='${k}'>${mi(k)}</button>`).join('')}</div><button class='alt' id='no'>${D.ca}</button>`);$('no').onclick=cls;$('bx').querySelector('.pg').onclick=e=>{const b=e.target.closest('[data-k]');if(b){m.img=b.dataset.k;save();cls();rme()}}}
$('me').onclick=ev=>{const b=ev.target.closest('[data-m]');if(!b)return;const i=+b.closest('.er').dataset.i;if(b.dataset.m==='x'){S.mus.splice(i,1);save();rme()}else pick(S.mus[i])};
$('ue').onclick=ev=>{const b=ev.target.closest('[data-m]');if(!b||b.disabled)return;S.units.splice(+b.closest('.er').dataset.i,1);save();rue()};
sortable($('me'),S.mus,rme);sortable($('ue'),S.units,rue);

function rBar(){$('mb').hidden=!sel.size;
  $('mb').innerHTML=`<span class='cn'>${sel.size}</span><select id='mvs'><option value='' selected disabled>${D.mv}</option>${S.mus.map(x=>`<option value='${x.id}'>${esc(mn(x))}</option>`).join('')}</select><button id='tr' aria-label='${D.bd}'><svg viewBox='0 0 24 24'><path d='M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5'/></svg></button><button id='sc'>✕</button>`;}
let dr=null;
$('mg').onpointerdown=e=>{const c=e.target.closest('.mc');if(!c)return;lpd=0;clearTimeout(lt);lt=setTimeout(()=>{lpd=1;sel.add(c.dataset.id);c.classList.add('sel','drag');rBar();dr=c;if(navigator.vibrate)navigator.vibrate(15)},450)};
document.addEventListener('pointermove',e=>{if(!dr)return;const g=$('mg'),t=document.elementFromPoint(e.clientX,e.clientY),o=t&&t.closest('.mc');
  if(o&&o!==dr&&g.contains(o)){const ch=[...g.children];g.insertBefore(dr,ch.indexOf(dr)<ch.indexOf(o)?o.nextSibling:o)}
  if(e.clientY<80)scrollBy(0,-12);else if(e.clientY>innerHeight-80)scrollBy(0,12)});
document.addEventListener('pointerup',()=>{if(!dr)return;const ids=[...$('mg').children].map(c=>c.dataset.id),slots=[],by=Object.fromEntries(S.marks.map(m=>[m.id,m]));S.marks.forEach((m,i)=>{if(mf(m)===fold)slots.push(i)});slots.forEach((i,j)=>{S.marks[i]=by[ids[j]]});dr.classList.remove('drag');dr=null;save()});
document.addEventListener('pointercancel',()=>{if(dr){dr.classList.remove('drag');dr=null}});

$('mg').onclick=e=>{if(lpd){lpd=0;return}const c=e.target.closest('.mc');if(!c)return;sel.size?tog(c.dataset.id):detail(c.dataset.id)};

const rsel=new Set();let rtm=0,rlp=0;
$('chips').insertAdjacentHTML('afterend',"<div class='mbar' id='rb' hidden></div>");
function rbar(){$('routine').classList.toggle('selmode',rsel.size>0);$('rb').hidden=!rsel.size;$('rb').innerHTML=`<span class='cn'>${rsel.size}</span><span style='flex:1'></span><button id='rtr' aria-label='${D.bd}'>${TR}</button><button id='rsc'>✕</button>`}
$('rl').onpointerdown=e=>{const c=e.target.closest('.ex');if(!c)return;rlp=0;clearTimeout(rtm);rtm=setTimeout(()=>{rlp=1;rsel.add(c.dataset.id);c.classList.add('sel');rbar();if(navigator.vibrate)navigator.vibrate(15)},450)};
['pointerup','pointerleave','pointercancel'].forEach(t=>{$('rl')['on'+t]=()=>clearTimeout(rtm)});
$('rl').oncontextmenu=e=>{if(e.target.closest('.ex'))e.preventDefault()};
$('rl').onclick=e=>{if(rlp){rlp=0;if(document.activeElement)document.activeElement.blur();return}const c=e.target.closest('.ex');if(c&&rsel.size){const id=c.dataset.id;rsel.has(id)?rsel.delete(id):rsel.add(id);c.classList.toggle('sel');rbar()}};
$('rb').onclick=e=>{if(e.target.closest('#rsc')){rsel.clear();routine()}if(e.target.closest('#rtr'))ask(D.dq.replace('{n}',rsel.size),D.dr,D.bd,()=>{S.routine[rd]=S.routine[rd].filter(x=>!rsel.has(x.id));rsel.clear();save();routine()},1)};

let gfold=null;
function rGuide(){
  if(!S.mus.some(m=>m.id===gfold))gfold=S.mus.length?S.mus[0].id:null;
  $('gf').innerHTML=S.mus.map(m=>`<button class='ch${m.id===gfold?' on':''}' data-f='${m.id}'>${esc(mn(m))}</button>`).join('');ctr($('gf'));
  const m=S.mus.find(x=>x.id===gfold),L=m&&m.d!=null?(K==='es'?GES:GEN)[m.d]:null;
  $('gl').innerHTML=L?L.map(t=>{const[a,b,c]=t.split('|');return `<article class='card'><h3>${a}</h3><p class='gt'><b>${D.gh}</b>${b}</p><p class='gt'><b>${D.gp}</b>${c}</p></article>`}).join(''):`<p class='empty'>${D.gn}</p>`;
}
$('gf').onclick=e=>{const b=e.target.closest('[data-f]');if(b){gfold=b.dataset.f;rGuide()}};
function show(v){
  ['today','routine','hist','progress','marks','guide','settings'].forEach(s=>{$(s).hidden=s!==v});$('nav').classList.remove('open');
  $('tt').textContent={today:D.td,routine:D.rt,hist:D.hs,marks:D.mk,progress:D.pg,guide:D.gd,settings:D.st}[v];
  ({today,routine,hist,progress:prog,marks:rMarks,guide:rGuide,settings:()=>{rme();rue()}})[v]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo(0,0)}

let cmo=null;
function rCal(){
  const y=cmo.getFullYear(),m=cmo.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),tk=key(new Date()),sk=key(cur);
  let g='';for(let i=0;i<off;i++)g+='<span></span>';
  for(let d=1;d<=n;d++){const k=y+'-'+p2(m+1)+'-'+p2(d);g+=`<button class='cd${S.days[k]?' done':''}${k===tk?' tod':''}${k===sk?' sel':''}' data-d='${k}'>${d}</button>`}
  let hy;try{hy=cap(new Intl.RelativeTimeFormat(NL,{numeric:'auto'}).format(0,'day'))}catch(e){hy='Today'}
  dlg(`<div class='cal'><div class='ch2'><button data-c='p'>‹</button><b>${cap(cmo.toLocaleDateString(NL,{month:'long',year:'numeric'}))}</b><button data-c='n'>›</button></div><div class='cw'>${SH.map(x=>`<span>${x}</span>`).join('')}</div><div class='cg'>${g}</div></div><button class='alt' id='ct'>${hy}</button><button class='alt' id='no'>${D.cl2}</button>`);
  $('no').onclick=cls;
  $('ct').onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);cls();today()};
  $('bx').querySelector('.cal').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c){cmo=new Date(y,m+(b.dataset.c==='n'?1:-1),1);rCal()}else if(b.dataset.d){cur=new Date(b.dataset.d+'T12:00:00');cls();today()}};
}
$('goto').onclick=()=>{cmo=new Date(cur.getFullYear(),cur.getMonth(),1);rCal()};
lang();theme();show('today');
</script>
